name: Build and Test on PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# The PR gate needs no credentials: the app is built for the iOS simulator without code
# signing and the unit tests run on a simulator. API keys and GoogleService plists are
# replaced by non-secret placeholders (see Scripts/ci-placeholder-keys.sh). Signed and
# distributed builds live in the other workflows.
env:
  RUN_IN_CI: true
  # DEBUG MODE: Set to 'true' to enable verbose test logging and upload the build logs
  DEBUG_CI: false

jobs:
  build:
    name: Build app
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup iOS Environment
        uses: ./.github/actions/install
        with:
          placeholder_keys: "true"

      - name: Build app
        run: bundle exec fastlane build_app_simulator

  test:
    name: Run tests
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup iOS Environment
        uses: ./.github/actions/install
        with:
          placeholder_keys: "true"

      - name: Run tests
        run: |
          if [ "${{ env.DEBUG_CI }}" = "true" ]; then
            bundle exec fastlane run_unit_tests debug:true
          else
            bundle exec fastlane run_unit_tests
          fi

      - name: Upload test logs
        if: env.DEBUG_CI == 'true' && (failure() || success())
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.run_number }}
          path: |
            ./fastlane/build_logs/
            ./fastlane/test_output/
          retention-days: 3
